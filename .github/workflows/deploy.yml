name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Works out whether worker/** changed in this push. The filter only runs on push; on a manual run
  # (workflow_dispatch) the output stays empty and the worker job deploys anyway.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      worker: ${{ steps.filter.outputs.worker }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for worker changes
        id: filter
        if: github.event_name == 'push'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            worker:
              - 'worker/**'

  # Same checks as CI, run before anything deploys. Skipped along with the worker deploy.
  worker-check:
    needs: changes
    if: needs.changes.outputs.worker == 'true' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
    uses: ./.github/workflows/worker-check.yml

  # Deploys the worker first when worker/** changed, and on every manual run, so the site never
  # ships ahead of a worker response it depends on. Otherwise the whole job is skipped.
  worker:
    needs: [changes, worker-check]
    if: needs.changes.outputs.worker == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # wrangler-action uses the wrangler version pinned in worker/package-lock.json once installed.
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      # New migrations first, so the deployed code never runs against an older schema. Migrations
      # must therefore keep working with the code that's live until the deploy finishes.
      - name: Migrate database and deploy worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          workingDirectory: worker
          command: |
            d1 migrations apply DB --remote
            deploy

  # Runs after the worker deployed or was skipped, never after it (or the change check) failed.
  build:
    needs: worker
    if: ${{ !failure() && !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # withastro/action has no node-version-file input, so this can't read .nvmrc; keep them in step.
      - name: Build with Astro
        uses: withastro/action@a8b97df764791eb61fbf3338ef713b0e61ae05c5 # v6.1.4
        with:
          node-version: 24

  # Needs its own condition: with the default success() check, a skipped worker job would skip
  # this one too even though build succeeded, because it looks at every upstream job.
  deploy:
    needs: build
    if: ${{ !failure() && !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
